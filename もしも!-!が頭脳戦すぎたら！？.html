const pr=(g,p)=>{const x=p%4,y=p>>2;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const X=x+a,Y=y+b;if(X>=0&&Y>=0&&X<4&&Y<4)g[Y*4+X]^=1})};

lights:{geo:GE,init(){const g=Array(16).fill(0);sh([...Array(16).keys()]).slice(0,3+M.min(5,lv>>1)).forEach(p=>pr(g,p));if(!g.some(x=>x))pr(g,5);return{g}},down(P,c,r){pr(P.g,r*4+c)},ok:P=>!P.g.some(x=>x),

behind:{geo:GE,init(){const t=Array(16).fill(0);sh([...Array(16).keys()]).slice(0,3+rnd(2)).forEach(i=>t[i]=1);return{t,g:Array(16).fill(0)}},down(P,c,r){P.g[r*4+c]^=1},ok:P=>P.g.every((v,i)=>v==P.t[i]),
